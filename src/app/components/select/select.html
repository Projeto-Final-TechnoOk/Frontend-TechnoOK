@if (label()) {
  <label>
    {{ label() }}
  </label>
}

<div class="select-container">
  <button type="button" class="select-controle" [class.placeholder]="!valor()" (click)="alternar()">
    {{ opcaoSelecionada()?.label ?? placeholder() }}

    <span class="seta">▼</span>
  </button>

  @if (aberto()) {
    <div class="select-opcoes">
      <input
        type="text"
        class="select-busca"
        placeholder="Digite para buscar..."
        [value]="busca()"
        (input)="alterarBusca($event)"
        (click)="$event.stopPropagation()"
      />

      @for (opcao of opcoesFiltradas(); track opcao.value) {
        <button type="button" class="select-opcao" (click)="selecionar(opcao)">
          {{ opcao.label }}
        </button>
      } @empty {
        <div class="nenhuma-opcao">Nenhuma opção encontrada.</div>
      }
    </div>
  }
</div>
